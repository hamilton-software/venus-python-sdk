[project]
name = "hamilton-venus-mcp-hub"
version = "0.1.0"
description = "MCP hub that fans commands out to networked hamilton-venus-mcp spokes (one per instrument PC) and compiles their results"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2,<2",
    "httpx",
]

[project.scripts]
hamilton-venus-mcp-hub = "hamilton_venus_mcp_hub.__main__:main"

[tool.setuptools.packages.find]
include = ["hamilton_venus_mcp_hub*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
