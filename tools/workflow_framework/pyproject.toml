[project]
name = "hamilton-workflow-framework"
version = "0.1.0"
description = "Reusable WebSocket/session/execution-engine backend for purpose-built Hamilton STAR workflow UIs, extracted from the hamilton-star-demo-app"
requires-python = ">=3.12"
dependencies = [
    "hamilton-venus-sdk",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.0,<3",
    "websockets>=16,<17",
]

[tool.setuptools.packages.find]
include = ["hamilton_workflow_framework*"]

[tool.setuptools.package-data]
hamilton_workflow_framework = ["static_assets/**/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
