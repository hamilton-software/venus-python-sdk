[project]
name = "hamilton-venus-orchestrator-client"
version = "0.1.0"
description = "Stdlib-only MCP client library for orchestrator 'card' workflows -- talks to a hamilton-venus-mcp spoke directly or through a hamilton-venus-mcp-hub, with no SDK or third-party dependency"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["orchestrator_client*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
