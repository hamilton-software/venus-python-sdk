[project]
name = "hamilton-venus-sdk"
dynamic = ["version"]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
description = "Python SDK for Hamilton Liquid Handling Platforms"
authors = [
    { name = "Hamilton Company" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "pysignalr>=1.0,<2",
    "pywin32>=308; platform_system == 'Windows'",
    "zeep>=4.2,<5",
]

[project.scripts]
setup-venus-sdk = "hamilton_venus.setup_tools.cli:main"
uninstall-venus-sdk = "hamilton_venus.setup_tools.uninstall:main"
venus-sdk = "hamilton_venus.tools:main"
hamilton-hhc = "hamilton_venus.heater_cooler:main"
hamilton-odtc = "hamilton_venus.odtc:main"
hamilton-inheco-tec = "hamilton_venus.inheco_tec:main"
hamilton-tilt-module = "hamilton_venus.tilt_module:main"
hamilton-media-fill = "hamilton_venus.media_fill:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pywin32>=308",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
setup = [
    "pywin32>=308",
]

[project.urls]
Documentation = "https://github.com/HamiltonCompany/hamilton-venus-sdk"
Repository = "https://github.com/HamiltonCompany/hamilton-venus-sdk"
Issues = "https://github.com/HamiltonCompany/hamilton-venus-sdk/issues"

[build-system]
requires = ["setuptools>=75", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools-scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hamilton_venus = [
    "error_handling/profiles/*.json",
    "error_handling/profiles/*.md",
    "error_simulator/data/*.json",
    "_com32_py32/**",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["UP040", "UP047"]

[tool.ruff.lint.per-file-ignores]
"src/hamilton_venus/catalog/*.py" = ["E501", "N801"]
"src/hamilton_venus/error_simulator/_generated_*.py" = ["E501"]
"src/hamilton_venus/error_simulator/exceptions.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
platform = "win32"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tomli", "zeep", "zeep.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hamilton_venus.mixins.*"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hamilton_venus --cov-report=term-missing"
